<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài tập 7 - Layout</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 20px; }
  #wrapper { width: 600px; margin: 0 auto; border: 3px solid #000; padding: 8px; overflow: hidden;
             box-shadow: -12px 12px 12px #999; background: #fff; }
  #wrapper::before { content: "wrapper"; display: block; margin: -30px 0 18px -8px; font-size: 18px; }
  header, nav, main, footer { border: 3px solid #000; padding: 8px; font-size: 20px; }
  header { height: 60px; margin-bottom: 8px; }
  nav { float: left; width: 100px; height: 400px; }
  main { margin-left: 108px; height: 400px; }
  footer { clear: both; height: 45px; margin-top: 8px; }
</style>
</head>
<body>
<div id="wrapper">
  <header>header</header>
  <nav>nav</nav>
  <main>main</main>
  <footer>footer</footer>
</div>
</body>
</html>
