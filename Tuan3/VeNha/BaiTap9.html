<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bài tập 9 - Font Awesome</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: inline-block; margin-right: 8px; background: cyan; }
  li a { display: block; padding: 10px 20px; font-size: 18px; color: #0a4d8c; text-decoration: none; }
  li a i { margin-right: 8px; }
  li:hover { background: #00bcd4; }
  .social { margin-top: 30px; font-size: 32px; }
  .social i { margin-right: 15px; color: #2b2f33; }
  .social i:hover { color: #00a8e8; }
</style>
</head>
<body>
<h2>Menu với Font Awesome</h2>
<ul>
  <li><a href="#"><i class="fa-solid fa-cart-shopping"></i>TMDT</a></li>
  <li><a href="#"><i class="fa-solid fa-building"></i>ERP</a></li>
  <li><a href="#"><i class="fa-solid fa-database"></i>MIS</a></li>
  <li><a href="#"><i class="fa-solid fa-chart-line"></i>DS</a></li>
</ul>
<div class="social">
  <i class="fa-brands fa-facebook"></i>
  <i class="fa-brands fa-github"></i>
  <i class="fa-brands fa-linkedin"></i>
  <i class="fa-solid fa-envelope"></i>
</div>
</body>
</html>
