<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Bat Family</title>
    <style>
        /* i. Khung chứa lớn */
        #root {
            width: 1024px;
            max-width: 100%;
            margin: 0 auto;
            text-align: center;
            font-family: Georgia, "Times New Roman", serif;
        }
        /* ii. site-header */
        #site-header {
            text-align: center;
            margin: 40px 0 30px;
            padding: 12px 0;
            background-color: #c8c8c8;
            background-image: url("imgs/logo.png");
            background-repeat: no-repeat;
            background-position: 36% center;
            background-size: 50px auto;
            color: #fff;
            font-size: 26px;
            text-shadow: 2px 2px 3px #333;
        }
        /* iii. li trong superheroes */
        .superheroes {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 0;
            white-space: nowrap;
        }
        .superheroes li {
            width: 18%;
            display: inline-block;
            position: relative;
            margin: 0 0.6%;
            vertical-align: top;
            transition: width 0.3s;
        }
        .hero-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 6px 0;
            font-size: 14px;
            color: #fff;
            text-align: center;
            text-shadow: 1px 1px 2px #000;
            opacity: 0.6;
            z-index: 2;
        }
        /* iv. Hình trong superheroes */
        .superheroes img {
            display: block;
            border: 1px solid #ddd;
            border-radius: 14px;
            max-width: 100%;
            opacity: 0.75;
            background: #fff;
            transition: opacity 0.3s;
        }
        /* v. Thẻ a trong superheroes */
        .superheroes a {
            display: none;
            width: 100%;
            color: #fff;
            background: #888;
            text-decoration: none;
            font-size: 12px;
            padding: 6px 0;
            text-align: center;
        }
        /* vi. Hover */
        .superheroes li:hover { width: 26%; }
        .superheroes li:hover img { opacity: 1; }
        .superheroes li:hover .hero-header { opacity: 1; background: rgba(0,0,0,0.6); }
        .superheroes li:hover a { display: block; }          /* 1. hiện Read more */
        .superheroes li:hover a:hover { text-decoration: underline; }  /* 1. gạch chân */
    </style>
</head>
<body>
    <div id="root">
        <h1 id="site-header"><span>The Bat family</span></h1>
        <ul class="superheroes">
            <li>
                <strong class="hero-header">Batman</strong>
                <img src="imgs/superhero-1.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Batman">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batwing</strong>
                <img src="imgs/superhero-2.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Batwing_(DC_Comics)">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batgirl</strong>
                <img src="imgs/superhero-3.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Batgirl">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Nightwing</strong>
                <img src="imgs/superhero-4.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Nightwing">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Red Robin</strong>
                <img src="imgs/superhero-5.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Red_Robin_(comics)">Read more</a>
            </li>
        </ul>
    </div>
</body>
</html>
