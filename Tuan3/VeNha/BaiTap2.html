<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài tập 2 - CSS Text</title>
<style>
  /* 2d: logo BIT 30px làm hình nền, lặp lại và cố định */
  body {
    background: #D0E4F5 url("https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png") repeat fixed 0 0;
    background-size: 30px;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  /* 2a */
  #university {
    color: blue;
    text-align: center;
    font-weight: bold;
    text-decoration: underline;
    font-size: 30px;
  }

  /* 2b */
  #faculty {
    color: red;
    text-align: right;
    font-style: italic;
    border: 3px dotted gold;
    border-radius: 18px;
    font-size: 15px;
    background-color: gray;
    opacity: 0.5;
  }

  /* 2c: hiệu ứng chữ BIT-UEH */
  #demotext {
    color: #A7DD3C;
    background: #FFFFFF;
    font-size: 60px;
    font-weight: bold;
    padding: 20px;
    text-shadow: 2px 0 0px #800040, 3px 2px 0px rgba(77,0,38,0.5), 3px 0 3px #FF002B, 5px 0 3px #800015, 6px 2px 3px rgba(77,0,13,0.5), 6px 0 9px #FF5500, 8px 0 9px #802A00, 9px 2px 9px rgba(77,25,0,0.5), 9px 0 18px #FFD500, 11px 0 18px #806A00, 12px 2px 18px rgba(77,66,0,0.5), 12px 0 30px #D4FF00, 14px 0 30px #6A8000, 15px 2px 30px rgba(64,77,0,0.5), 15px 0 45px #80FF00, 17px 0 45px #408000, 17px 2px 45px rgba(38,77,0,0.5);
  }

  /* 2e */
  #clip {
    width: 100px;
    height: 50px;
    overflow: hidden;            /* i. ẩn nội dung bị tràn */
    text-overflow: ellipsis;     /* ii. cắt nội dung tràn bằng ... */
    white-space: nowrap;         /* iii. không xuống dòng */
    background: #fff;
    border: 1px solid #333;
  }
</style>
</head>
<body>
  <p id="university">Đại học UEH</p>
  <p id="faculty">Khoa CNTTKD</p>
  <div id="demotext">BIT-UEH</div>
  <br>
  <p id="clip">Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều</p>
  <div style="height:800px"></div>
</body>
</html>
