<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; }
  .portfolio { width: 1100px; max-width: 100%; margin: 0 auto; box-sizing: border-box; }
  .portfolio h2 { text-align: center; font-size: 18px; color: #333; margin: 0; padding: 25px 0 20px; background: #f7f7f7; position: relative; }
  .portfolio h2::after { content: ""; display: block; width: 50px; height: 2px; background: #2a9d9d; margin: 12px auto 0; }
  .list-tab { list-style: none; margin: 0; padding: 0 0 25px; text-align: center; background: #f7f7f7; }
  .list-tab li { display: inline-block; margin: 0 8px; }
  .list-tab a { text-decoration: none; font-size: 11px; font-weight: bold; color: #333; }
  .list-tab li:first-child a, .list-tab a:hover { color: #2a9d9d; }
  .galerry { list-style: none; margin: 5px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .galerry li { background: #9ccc7a; aspect-ratio: 350 / 260; overflow: hidden; }
  .galerry a { display: block; height: 100%; }
  .galerry img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
